plugins {
    // Minecraft 26.x ships unobfuscated, so no mappings layer is needed and the
    // non-remapping Loom plugin variant is the correct one.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = mod_group_id
version = "${mod_version}-mc${minecraft_version.replace('.', '')}"

base {
    archivesName = mod_id
}

repositories {
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
    // Sodium publishes its releases to Modrinth, which mirrors them through a
    // Maven repository. Only the Sodium group is read from here.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // The Mod Menu API, used for the optional Mod Menu entry.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Used by the HUD overlay to build the text transform matrix.
    implementation "org.joml:joml:${joml_version}"
    // Gson ships with Minecraft and is used for the profile file.
    implementation "com.google.code.gson:gson:${gson_version}"

    // Sodium is optional at runtime: the Config API entrypoint is only ever
    // loaded by Sodium itself, and the jar is never bundled or required. The
    // release that matches the targeted Minecraft version is compiled against so
    // the entrypoint is type-checked for every supported game line.
    //
    // Modrinth version numbers of the Sodium releases that carry the Config API:
    // 0.9.2 for Minecraft 26.2 and for Minecraft 26.3.
    def sodiumVersion = [
        '26.2': 'mc26.2-0.9.2-fabric',
        '26.3': 'mc26.3-0.9.2-fabric',
        '26.1.2': 'mc26.1.2-0.9.2-fabric',
    ][minecraft_version]
    if (sodiumVersion == null) {
        throw new GradleException("No Sodium Config API artifact is mapped for Minecraft ${minecraft_version}. " +
                "Add the matching release to the sodiumVersion map in fabric/build.gradle.")
    }
    compileOnly "maven.modrinth:AANobbMI:${sodiumVersion}"

    // The Mod Menu API is optional in exactly the same way. The entrypoint
    // that implements it is only ever loaded when Mod Menu asks for it.
    def modMenuVersion = [
        '26.2': '20.0.3',
        '26.3': '21.0.1',
        '26.1.2': '18.0.2',
    ][minecraft_version]
    if (modMenuVersion == null) {
        throw new GradleException("No Mod Menu API artifact is mapped for Minecraft ${minecraft_version}. " +
                "Add the matching release to the modMenuVersion map in fabric/build.gradle.")
    }
    compileOnly "com.terraformersmc:modmenu:${modMenuVersion}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // MixinTargetSignatureTest reads @Mixin (CLASS retention) from bytecode.
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            client()
        }
    }
}

// The mod is Fabric only, so everything lives in this project.
sourceSets {
    main {
        java {
            // Version specific API shim (26.2 vs 26.3) plus the shared core.
            srcDirs = ['src/main/java',
                       "src/compat/mc${minecraft_version.replace('.', '_')}/java"]
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

processResources {
    def properties = [
        version               : project.version,
        mod_id                : mod_id,
        minecraft_version     : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        loader_version_range  : loader_version_range,
        fabric_version_range  : fabric_version_range,
        java_version_range    : java_version_range
    ]
    inputs.properties properties
    filteringCharset = 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
    // Keep the config tests off the developer's real config directory.
    systemProperty 'inputbooster.configDir', layout.buildDirectory.dir('test-config').get().asFile.absolutePath
    // The resolved target version (honours -Pminecraft_version overrides).
    systemProperty 'inputbooster.minecraftVersion', project.minecraft_version
    inputs.property 'minecraftVersion', project.minecraft_version
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

jar {
    // The licence file lives in the repository root, not in this build dir.
    from("${rootDir}/../LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}