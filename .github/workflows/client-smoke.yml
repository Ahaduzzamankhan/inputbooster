name: Minecraft Client Smoke Test

on:
  push:
    branches:
      - main
      - fabric-26.2-26.3
    paths:
      - "fabric/**"
      - "src/**"
      - ".github/workflows/client-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-smoke:
    name: Launch Minecraft ${{ matrix.minecraft }} (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.2"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          # The X server, the GLX provider and the software rasteriser are what
          # the client needs to get a context. The Mesa Vulkan driver is the
          # fallback for the clients that ask for a surface extension the
          # hardware drivers of the runner cannot provide.
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers
          # The rest is best effort: some of these packages do not exist on
          # every runner image, and a missing one must not fail the job.
          sudo apt-get install -y libegl1 libgles2 libxrandr2 libxinerama1 libxcursor1 \
            libxi6 libxxf86vm1 libxext6 libxrender1 x11-utils \
            || echo "some optional graphics packages are unavailable on this image"

      - name: Check the headless OpenGL context
        run: |
          # The client needs a GLX visual that matches the OpenGL version it
          # asks for. Xvfb defaults to an 8 bit screen, which leaves llvmpipe
          # without a usable visual, so the screen is opened with a 24 bit
          # depth and the software renderer is pinned.
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            glxinfo -B 2>&1 | tee /tmp/glxinfo.txt
          grep -q "OpenGL version string" /tmp/glxinfo.txt \
            || { echo "the headless runner has no usable OpenGL context" >&2; exit 1; }

      - name: Launch Fabric client and verify startup
        working-directory: fabric
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
          GALLIUM_DRIVER: "llvmpipe"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          # The client opens its window through SDL, which needs to be told to
          # use the X display and to stay quiet about the sound device.
          SDL_VIDEODRIVER: "x11"
          SDL_AUDIODRIVER: "dummy"
        run: |
          chmod +x gradlew
          timeout --signal=TERM --kill-after=10s 240s \
            xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            ./gradlew runClient --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }} > client-console.log 2>&1 &
          CLIENT_PID=$!

          cleanup() {
            kill "$CLIENT_PID" 2>/dev/null || true
            wait "$CLIENT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 210); do
            if [ -f run/logs/latest.log ] && grep -Fq "Sound engine started" run/logs/latest.log; then
              READY=1
              break
            fi

            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              echo "Minecraft client exited before reaching the startup marker."
              wait "$CLIENT_PID" || true
              cat client-console.log
              [ ! -f run/logs/latest.log ] || cat run/logs/latest.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Minecraft did not reach the sound-engine startup marker within 210 seconds."
            cat client-console.log
            [ ! -f run/logs/latest.log ] || tail -n 200 run/logs/latest.log
            exit 1
          fi

          echo "Minecraft reached the client startup marker. Checking that it remains running..."
          sleep 10
          if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
            echo "Minecraft exited immediately after startup."
            cat client-console.log
            tail -n 200 run/logs/latest.log
            exit 1
          fi
          echo "PASS: Fabric client stayed alive after startup for Minecraft ${{ matrix.minecraft }}."

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-logs-mc${{ matrix.minecraft }}
          path: |
            fabric/client-console.log
            fabric/run/logs/
            fabric/run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
