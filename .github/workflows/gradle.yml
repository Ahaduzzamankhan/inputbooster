name: Build and Release

# The single pipeline: it tests both Minecraft lines, builds the two jars,
# uploads them as artifacts and attaches them to the GitHub release. There is no
# headless client job — the client is tested by hand.

on:
  push:
    branches: [ "main", "fabric-26.2-26.3" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "fabric-26.2-26.3" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.0. Leave empty to use gradle.properties."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build Fabric jar (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric loader 0.19.5 cannot evaluate bracket ranges such as
          # [26.2,26.3) for two-component Minecraft versions, so the space
          # separated comparison form is used for the declared dependency.
          - minecraft: "26.2"
            suffix: "262"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            suffix: "263"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          cd fabric
          chmod +x gradlew
          # clean test build: the tests are part of the release pipeline, so a
          # version that does not pass them cannot publish a jar.
          ./gradlew clean test build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-mc${{ matrix.minecraft }}
          path: |
            fabric/build/reports/tests/test/
            fabric/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          jar="fabric/build/libs/inputbooster-*-mc${{ matrix.suffix }}.jar"
          unzip -p $jar fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": *">=' /tmp/fabric.mod.json \
            || { echo "minecraft dependency must use the '>=x <y' form" >&2; exit 1; }
          # The Sodium configuration pages are only reachable through the
          # Sodium Config API entrypoint.
          grep -q '"sodium:config_api_user"' /tmp/fabric.mod.json \
            || { echo "the Sodium config entrypoint must be declared" >&2; exit 1; }
          grep -q 'dev.inputbooster.compat.sodium.SodiumConfigEntryPoint' /tmp/fabric.mod.json \
            || { echo "the Sodium config entrypoint must point at SodiumConfigEntryPoint" >&2; exit 1; }
          # Sodium and Mod Menu stay optional: their classes must never be
          # bundled into the InputBooster jar.
          if unzip -l $jar | grep -q 'net/caffeinemc/mods/sodium/'; then
            echo "Sodium classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi
          if unzip -l $jar | grep -q 'com/terraformersmc/modmenu/'; then
            echo "Mod Menu classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find fabric/build/libs -maxdepth 1 -type f -name "inputbooster-*-mc${{ matrix.suffix }}.jar" | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No Fabric jar found in fabric/build/libs" >&2
            find fabric/build/libs -type f >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-fabric-mc${{ matrix.minecraft }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-fabric]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main'))
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "$GITHUB_REF" == refs/tags/* ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # The version and the tag live in the Fabric project, because the
            # mod is Fabric only.
            raw="$(grep '^mod_version=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            tag="$(grep '^release_tag=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            if [ -z "$tag" ]; then
              tag="v${raw}"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already tagged
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          # A branch push publishes a version once. Tag pushes and manual runs
          # always publish, which is how an existing release gets updated.
          #
          # "Published once" is decided by the release's own jars, not by the
          # tag: the tag is created by the release step below, so a run that
          # created it and then failed to attach the jars used to leave a
          # release with no download and every later push skipped it.
          if [ "${{ github.event_name }}" == "push" ] && [ "$GITHUB_REF" != "refs/tags/*" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              published_jars=0
              if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
                published_jars="$(printf '%s' "$release_json" \
                  | jq '[.assets[] | select(.name | endswith(".jar"))] | length' 2>/dev/null || echo 0)"
              fi
              if [ "${published_jars:-0}" -ge 2 ]; then
                echo "Tag ${tag} already has its jars; nothing to publish."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Tag ${tag} exists with ${published_jars:-0} jar(s); updating the release."
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download built jars
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          if [ ${#jars[@]} -lt 2 ]; then
            echo "Expected the Fabric 26.2 and 26.3 jars, found ${#jars[@]}" >&2
            ls -la release-artifacts >&2
            exit 1
          fi
          ls -la release-artifacts

      - name: Generate changelog
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## InputBooster ${tag}"
            echo
            echo "Loader support in this release:"
            echo
            echo "- Fabric — Minecraft 26.2"
            echo "- Fabric — Minecraft 26.3"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes in this release:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
          } > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "## InputBooster ${tag}" > release_notes.md
            echo >> release_notes.md
            echo "- Built from ${GITHUB_SHA}." >> release_notes.md
          fi

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: InputBooster ${{ steps.release.outputs.tag }}
          body_path: release_notes.md
          # The two jars come from the build jobs above. This step attaches
          # them and creates the tag itself when the version is new.
          files: release-artifacts/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(steps.release.outputs.version, 'alpha') || contains(steps.release.outputs.version, 'beta') }}
          make_latest: true
