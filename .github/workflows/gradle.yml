name: Build and Release

on:
  push:
    branches: [ "main", "fabric-26.2-26.3" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.0. Leave empty to use gradle.properties."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-neoforge:
    name: Build NeoForge jar (MC 26.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'inputbooster-*-nf-mc262.jar' | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No NeoForge jar found in build/libs" >&2
            find build/libs -type f >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-neoforge-mc26.2
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  build-fabric:
    name: Build Fabric jar (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric loader 0.19.5 cannot evaluate bracket ranges such as
          # [26.2,26.3) for two-component Minecraft versions, so the space
          # separated comparison form is used for the declared dependency.
          - minecraft: "26.2"
            suffix: "262"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            suffix: "263"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          cd fabric
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          jar="fabric/build/libs/inputbooster-*-fabric-mc${{ matrix.suffix }}.jar"
          unzip -p $jar fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": *">=' /tmp/fabric.mod.json \
            || { echo "minecraft dependency must use the '>=x <y' form" >&2; exit 1; }

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find fabric/build/libs -maxdepth 1 -type f -name "inputbooster-*-fabric-mc${{ matrix.suffix }}.jar" | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No Fabric jar found in fabric/build/libs" >&2
            find fabric/build/libs -type f >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-fabric-mc${{ matrix.minecraft }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-neoforge, build-fabric]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            tag="v${version}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          if [[ ${#jars[@]} -lt 3 ]]; then
            echo "Expected the NeoForge 26.2 jar plus both Fabric jars, found ${#jars[@]}" >&2
            ls -la release-artifacts >&2
            exit 1
          fi
          ls -la release-artifacts

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## InputBooster ${tag}"
            echo
            echo "Loader support in this release:"
            echo
            echo "- NeoForge — Minecraft 26.2"
            echo "- Fabric — Minecraft 26.2"
            echo "- Fabric — Minecraft 26.3"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes in this release:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
          } > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "## InputBooster ${tag}" > release_notes.md
            echo >> release_notes.md
            echo "- Built from ${GITHUB_SHA}." >> release_notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: InputBooster ${{ steps.release.outputs.tag }}
          body_path: release_notes.md
          files: release-artifacts/*.jar
          generate_release_notes: true
          make_latest: true

  tag:
    name: Create release tag from mod_version
    runs-on: ubuntu-latest
    needs: [build-neoforge, build-fabric]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - name: Create the tag when the version is new
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gradle.properties carries the loader flavour, for example
          # 4.0.1-beta-nf-mc262. The release tag is the version without it.
          raw="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          version="$(echo "$raw" | sed -E 's/-(nf|fabric)(-.*)?$//')"
          tag="v${version}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on the remote; nothing to do."
            exit 0
          fi

          # Creating the ref is a tag push, so this run's own release job picks
          # it up on the next workflow run and attaches the three jars.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}"
          echo "Created tag ${tag} at ${GITHUB_SHA}."