name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.0.2-rl02. Leave empty to use gradle.properties."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build NeoForge jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            tag="v${version}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Find release jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find release-artifacts -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No jar found in downloaded artifacts" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## InputBooster ${tag}"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes in this release:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
          } > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "## InputBooster ${tag}" > release_notes.md
            echo >> release_notes.md
            echo "- Built from ${GITHUB_SHA}." >> release_notes.md
          fi

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally."
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: InputBooster ${{ steps.release.outputs.tag }}
          body_path: release_notes.md
          files: |
            ${{ steps.jar.outputs.path }}
            release_notes.md
          generate_release_notes: true
          make_latest: true
