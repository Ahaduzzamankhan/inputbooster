name: Build and Release

# The single pipeline: it tests every supported Minecraft line, builds one jar
# per line, uploads them as artifacts and attaches them to the GitHub release.
# There is no headless client job — the client is tested by hand.

on:
  push:
    branches: [ "main", "fabric-26.2-26.3" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "fabric-26.2-26.3" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.0. Leave empty to use gradle.properties."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build Fabric jar (MC ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric loader 0.19.x cannot evaluate bracket ranges such as
          # [26.2,26.3) for two-component Minecraft versions, so the space
          # separated comparison form is used for the declared dependency.
          - project: fabric
            minecraft: "26.2"
            suffix: "262"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
            sodium_config: "true"
            java: "25"
          - project: fabric
            minecraft: "26.3"
            suffix: "263"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"
            sodium_config: "true"
            java: "25"
          - project: fabric-26.1
            minecraft: "26.1"
            suffix: "261"
            version_range: ">=26.1 <26.2"
            fabric_api: "0.155.3+26.1.2"
            sodium_config: "true"
            java: "25"
          - project: fabric-26.1.2
            minecraft: "26.1.2"
            suffix: "2612"
            version_range: ">=26.1.2 <26.1.3"
            fabric_api: "0.155.3+26.1.2"
            sodium_config: "true"
            java: "25"
          # 1.21.x Sodium releases do not ship the Config API, and those builds
          # target Java 21, the runtime Minecraft itself uses.
          - project: fabric-1.21.11
            minecraft: "1.21.11"
            suffix: "12111"
            version_range: ">=1.21.11 <1.21.12"
            fabric_api: "0.141.6+1.21.11"
            sodium_config: "false"
            java: "21"
          - project: fabric-1.21.4
            minecraft: "1.21.4"
            suffix: "1214"
            version_range: ">=1.21.4 <1.21.5"
            fabric_api: "0.119.4+1.21.4"
            sodium_config: "false"
            java: "21"
          - project: fabric-1.21.1
            minecraft: "1.21.1"
            suffix: "1211"
            version_range: ">=1.21.1 <1.21.2"
            fabric_api: "0.116.18+1.21.1"
            sodium_config: "false"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The 1.21.x projects target Java 21, the runtime Minecraft itself uses.
      # This step runs last, so JAVA_HOME and the Gradle toolchain are 21 there.
      - name: Setup Java 21
        if: matrix.java == '21'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          cd ${{ matrix.project }}
          chmod +x gradlew
          # clean test build: the tests are part of the release pipeline, so a
          # version that does not pass them cannot publish a jar.
          ./gradlew clean test build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-mc${{ matrix.minecraft }}
          path: |
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          jar="${{ matrix.project }}/build/libs/inputbooster-*-mc${{ matrix.suffix }}.jar"
          unzip -p $jar fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": *">=' /tmp/fabric.mod.json \
            || { echo "minecraft dependency must use the '>=x <y' form" >&2; exit 1; }
          # The Sodium configuration pages are only reachable through the
          # Sodium Config API entrypoint, and only Sodium releases that ship it
          # may carry the declaration.
          if [ "${{ matrix.sodium_config }}" == "true" ]; then
            grep -q '"sodium:config_api_user"' /tmp/fabric.mod.json \
              || { echo "the Sodium config entrypoint must be declared" >&2; exit 1; }
            grep -q 'dev.inputbooster.compat.sodium.SodiumConfigEntryPoint' /tmp/fabric.mod.json \
              || { echo "the Sodium config entrypoint must point at SodiumConfigEntryPoint" >&2; exit 1; }
          else
            if grep -q '"sodium:config_api_user"' /tmp/fabric.mod.json; then
              echo "this Sodium release has no Config API, so the entrypoint must not be declared" >&2
              exit 1
            fi
          fi
          # Sodium and Mod Menu stay optional: their classes must never be
          # bundled into the InputBooster jar.
          if unzip -l $jar | grep -q 'net/caffeinemc/mods/sodium/'; then
            echo "Sodium classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi
          if unzip -l $jar | grep -q 'com/terraformersmc/modmenu/'; then
            echo "Mod Menu classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find ${{ matrix.project }}/build/libs -maxdepth 1 -type f -name "inputbooster-*-mc${{ matrix.suffix }}.jar" | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No Fabric jar found in ${{ matrix.project }}/build/libs" >&2
            find ${{ matrix.project }}/build/libs -type f >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-mc${{ matrix.minecraft }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-fabric]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main'))
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "$GITHUB_REF" == refs/tags/* ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            # The version and the tag live in the Fabric project, because the
            # mod is Fabric only.
            raw="$(grep '^mod_version=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            tag="$(grep '^release_tag=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            if [ -z "$tag" ]; then
              tag="v${raw}"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          if [ ${#jars[@]} -lt 7 ]; then
            echo "Expected one jar per supported Minecraft line (7), found ${#jars[@]}" >&2
            ls -la release-artifacts >&2
            exit 1
          fi
          ls -la release-artifacts

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## InputBooster ${tag}"
            echo
            echo "Loader support in this release:"
            echo
            echo "- Fabric — Minecraft 26.3"
            echo "- Fabric — Minecraft 26.2"
            echo "- Fabric — Minecraft 26.1.2"
            echo "- Fabric — Minecraft 26.1"
            echo "- Fabric — Minecraft 1.21.11"
            echo "- Fabric — Minecraft 1.21.4"
            echo "- Fabric — Minecraft 1.21.1"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes in this release:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
          } > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "## InputBooster ${tag}" > release_notes.md
            echo >> release_notes.md
            echo "- Built from ${GITHUB_SHA}." >> release_notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: InputBooster ${{ steps.release.outputs.tag }}
          body_path: release_notes.md
          # The jars come from the build jobs above. This step attaches them
          # and creates the tag itself when the version is new.
          files: release-artifacts/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(steps.release.outputs.version, 'alpha') || contains(steps.release.outputs.version, 'beta') }}
          make_latest: true
