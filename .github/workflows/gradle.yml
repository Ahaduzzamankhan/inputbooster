name: Build and Release

on:
  push:
    branches: [ "fabric-26.2", "fabric-26.3" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "fabric-26.2", "fabric-26.3" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1.6-mc26.3. Leave empty to use gradle.properties."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-fabric:
    name: Build Fabric jar
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.target.outputs.minecraft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every branch builds exactly one Minecraft version, pinned in
      # fabric/gradle.properties: fabric-26.2 -> 26.2, fabric-26.3 -> 26.3.
      - name: Resolve target Minecraft version
        id: target
        shell: bash
        run: |
          set -euo pipefail
          value="$(grep '^minecraft_version=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          if [[ -z "$value" ]]; then
            echo "minecraft_version is not set in fabric/gradle.properties" >&2
            exit 1
          fi
          echo "minecraft=$value" >> "$GITHUB_OUTPUT"
          echo "Building for Minecraft $value"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          mc="${{ steps.target.outputs.minecraft }}"
          suffix="${mc/./}"
          jar="fabric/build/libs/inputbooster-*-fabric-mc${suffix}.jar"
          unzip -p $jar fabric.mod.json | tee /tmp/fabric.mod.json
          grep -q '"minecraft": *">=' /tmp/fabric.mod.json \
            || { echo "minecraft dependency must use the '>=x <y' form" >&2; exit 1; }

      - name: Find built jar
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          mc="${{ steps.target.outputs.minecraft }}"
          suffix="${mc/./}"
          jar_path="$(find fabric/build/libs -maxdepth 1 -type f -name "inputbooster-*-fabric-mc${suffix}.jar" | sort | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "No Fabric jar found in fabric/build/libs" >&2
            find fabric/build/libs -type f >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-fabric-mc${{ steps.target.outputs.minecraft }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-fabric]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            mc="$(grep '^minecraft_version=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
            tag="v${mc}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          if [[ ${#jars[@]} -lt 1 ]]; then
            echo "Expected the Fabric jar, found ${#jars[@]}" >&2
            exit 1
          fi
          ls -la release-artifacts

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          mc="$(grep '^minecraft_version=' fabric/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          previous_tag="$(git tag --sort=-creatordate | grep '^v' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## InputBooster ${tag}"
            echo
            echo "Loader support in this release:"
            echo
            echo "- Fabric — Minecraft ${mc}"
            echo
            echo "NeoForge support is paused; see the CHANGELOG for the plan."
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log "${previous_tag}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              echo "Changes in this release:"
              echo
              git log --pretty=format:'- %s (%h)' --no-merges
            fi
            echo
            echo
            echo "See CHANGELOG.md for the full list."
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          # Published as a stable release: the 3.1.x line is what players are
          # told to install, and marking it a prerelease hides it from the
          # default releases list.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/*.jar --clobber
            gh release edit "$tag" --notes-file release-notes.md \
              --prerelease=false --latest
          else
            gh release create "$tag" release-artifacts/*.jar \
              --title "InputBooster $tag" \
              --notes-file release-notes.md \
              --prerelease=false --latest
          fi