name: Build and Release

# Two independent release lines:
#   modern  — Minecraft 26.1 / 26.1.1 / 26.1.2 / 26.2 / 26.3, mod version 4.1.3-alpha1
#   legacy  — Minecraft 1.21.1 / 1.21.4 / 1.21.11,              mod version 3.1.6-alpha
# Each line builds and tests its own targets and publishes its own tag, so a
# modern jar can never end up in the legacy release or the other way round.
# There is no headless client job — the game is tested by hand.

on:
  push:
    branches: [ "main", "fabric-26.2-26.3" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "fabric-26.2-26.3" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-modern:
    name: Modern — MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric loader 0.19.x cannot evaluate bracket ranges such as
          # [26.2,26.3) for two-component Minecraft versions, so the space
          # separated comparison form is used for the declared dependency.
          - project: fabric
            minecraft: "26.3"
            suffix: "263"
            mod_version: "4.1.3-alpha1"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"
          - project: fabric
            minecraft: "26.2"
            suffix: "262"
            mod_version: "4.1.3-alpha1"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
          - project: fabric-26.1.2
            minecraft: "26.1.2"
            suffix: "2612"
            mod_version: "4.1.3-alpha1"
            version_range: ">=26.1.2 <26.1.3"
            fabric_api: "0.155.3+26.1.2"
          - project: fabric-26.1.1
            minecraft: "26.1.1"
            suffix: "2611"
            mod_version: "4.1.3-alpha1"
            version_range: ">=26.1.1 <26.1.2"
            fabric_api: "0.155.3+26.1.2"
          - project: fabric-26.1
            minecraft: "26.1"
            suffix: "261"
            mod_version: "4.1.3-alpha1"
            version_range: ">=26.1 <26.2"
            fabric_api: "0.155.3+26.1.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          cd ${{ matrix.project }}
          chmod +x gradlew
          # clean test build: a target that does not pass its tests cannot
          # publish a jar.
          ./gradlew clean test build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          jar="${{ matrix.project }}/build/libs/inputbooster-${{ matrix.mod_version }}-mc${{ matrix.suffix }}.jar"
          test -f "$jar" || { echo "missing $jar" >&2; exit 1; }
          unzip -p "$jar" fabric.mod.json > /tmp/fabric.mod.json
          cat /tmp/fabric.mod.json
          grep -q "\"version\": \"${{ matrix.mod_version }}-mc${{ matrix.suffix }}\"" /tmp/fabric.mod.json \
            || { echo "jar version does not match ${{ matrix.mod_version }}" >&2; exit 1; }
          grep -q '"minecraft": ">=' /tmp/fabric.mod.json \
            || { echo "minecraft dependency must use the '>=x <y' form" >&2; exit 1; }
          grep -q "\"minecraft\": \"${{ matrix.version_range }}\"" /tmp/fabric.mod.json \
            || { echo "minecraft dependency must be ${{ matrix.version_range }}" >&2; exit 1; }
          grep -q '"java": ">=25"' /tmp/fabric.mod.json \
            || { echo "the 26.x jars require Java 25" >&2; exit 1; }
          grep -q '"sodium:config_api_user"' /tmp/fabric.mod.json \
            || { echo "the Sodium config entrypoint must be declared" >&2; exit 1; }
          # Sodium and Mod Menu stay optional: their classes must never be
          # bundled into the InputBooster jar.
          if unzip -l "$jar" | grep -q 'net/caffeinemc/mods/sodium/'; then
            echo "Sodium classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi
          if unzip -l "$jar" | grep -q 'com/terraformersmc/modmenu/'; then
            echo "Mod Menu classes must not be bundled into the InputBooster jar" >&2
            exit 1
          fi

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-modern-mc${{ matrix.minecraft }}
          path: |
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-mc${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/inputbooster-${{ matrix.mod_version }}-mc${{ matrix.suffix }}.jar
          if-no-files-found: error

  build-legacy:
    name: Legacy — MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.21.11
            minecraft: "1.21.11"
            suffix: "12111"
            mod_version: "3.1.6-alpha"
            version_range: ">=1.21.11 <1.21.12"
            fabric_api: "0.141.6+1.21.11"
          - project: fabric-1.21.4
            minecraft: "1.21.4"
            suffix: "1214"
            mod_version: "3.1.6-alpha"
            version_range: ">=1.21.4 <1.21.5"
            fabric_api: "0.119.4+1.21.4"
          - project: fabric-1.21.1
            minecraft: "1.21.1"
            suffix: "1211"
            mod_version: "3.1.6-alpha"
            version_range: ">=1.21.1 <1.21.2"
            fabric_api: "0.116.18+1.21.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The 1.21.x projects compile and test on a Java 21 toolchain, the runtime
      # Minecraft itself uses. Gradle keeps running on 25: fabric-loom 1.18.2
      # refuses to load on a Java 21 JVM.
      - name: Setup Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_25_X64:-}" ]; then
            export JAVA_HOME="$JAVA_HOME_25_X64"
          fi
          toolchain_args=()
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            toolchain_args+=("-Dorg.gradle.java.installations.paths=${JAVA_HOME_21_X64}")
          fi
          cd ${{ matrix.project }}
          chmod +x gradlew
          ./gradlew clean test build --no-daemon \
            "${toolchain_args[@]}" \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Verify mod metadata
        shell: bash
        run: |
          set -euo pipefail
          jar="${{ matrix.project }}/build/libs/inputbooster-${{ matrix.mod_version }}-mc${{ matrix.suffix }}.jar"
          test -f "$jar" || { echo "missing $jar" >&2; exit 1; }
          unzip -p "$jar" fabric.mod.json > /tmp/fabric.mod.json
          cat /tmp/fabric.mod.json
          grep -q "\"version\": \"${{ matrix.mod_version }}-mc${{ matrix.suffix }}\"" /tmp/fabric.mod.json \
            || { echo "jar version does not match ${{ matrix.mod_version }}" >&2; exit 1; }
          grep -q "\"minecraft\": \"${{ matrix.version_range }}\"" /tmp/fabric.mod.json \
            || { echo "minecraft dependency must be ${{ matrix.version_range }}" >&2; exit 1; }
          # Minecraft 1.21.x runs on Java 21: a ">=25" floor here stops the loader
          # before the mod ever loads.
          grep -q '"java": ">=21"' /tmp/fabric.mod.json \
            || { echo "the 1.21.x jars must allow Java 21" >&2; exit 1; }
          if grep -q '"sodium:config_api_user"' /tmp/fabric.mod.json; then
            echo "this Sodium release has no Config API, so the entrypoint must not be declared" >&2
            exit 1
          fi

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-legacy-mc${{ matrix.minecraft }}
          path: |
            ${{ matrix.project }}/build/reports/tests/test/
            ${{ matrix.project }}/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-mc${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/inputbooster-${{ matrix.mod_version }}-mc${{ matrix.suffix }}.jar
          if-no-files-found: error

  release-modern:
    name: Publish 4.1.3-alpha1
    runs-on: ubuntu-latest
    needs: [build-modern]
    if: >-
      startsWith(github.ref, 'refs/tags/v4.') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main'))
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download modern jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-mc26*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          echo "found ${#jars[@]} modern jar(s)"
          ls -la release-artifacts
          if [ ${#jars[@]} -lt 5 ]; then
            echo "Expected five modern jars (26.1, 26.1.1, 26.1.2, 26.2, 26.3), found ${#jars[@]}" >&2
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "$(basename "$jar")" in
              inputbooster-4.1.3-alpha1-mc26*.jar) ;;
              *) echo "unexpected jar in the modern release: $jar" >&2; exit 1 ;;
            esac
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.3-alpha1
          name: InputBooster 4.1.3-alpha1
          body_path: RELEASE_NOTES_4.1.3-alpha1.md
          files: release-artifacts/*.jar
          prerelease: true
          make_latest: true

  release-legacy:
    name: Publish 3.1.6-alpha
    runs-on: ubuntu-latest
    needs: [build-legacy]
    if: >-
      startsWith(github.ref, 'refs/tags/v3.') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main'))
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download legacy jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-mc1.21*
          path: release-artifacts
          merge-multiple: true

      - name: Verify jars
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(release-artifacts/*.jar)
          echo "found ${#jars[@]} legacy jar(s)"
          ls -la release-artifacts
          if [ ${#jars[@]} -lt 3 ]; then
            echo "Expected three legacy jars (1.21.1, 1.21.4, 1.21.11), found ${#jars[@]}" >&2
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "$(basename "$jar")" in
              inputbooster-3.1.6-alpha-mc121*.jar) ;;
              *) echo "unexpected jar in the legacy release: $jar" >&2; exit 1 ;;
            esac
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.6-alpha
          name: InputBooster 3.1.6-alpha
          body_path: RELEASE_NOTES_3.1.6-alpha.md
          files: release-artifacts/*.jar
          prerelease: true
          make_latest: false

  publish-modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    needs: [build-modern, build-legacy]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/fabric-26.2-26.3' || github.ref == 'refs/heads/main'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download modern jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-mc26*
          path: modrinth-artifacts/modern
          merge-multiple: true

      - name: Download legacy jars
        uses: actions/download-artifact@v4
        with:
          pattern: inputbooster-mc1*
          path: modrinth-artifacts/legacy
          merge-multiple: true

      # Uploads every built jar as its own Modrinth version, which is how the
      # project is already listed there. Without the token the step reports a
      # notice and succeeds: a fork or a push from a repo without the secret
      # must not fail the build.
      - name: Publish versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID || 'inputbooster' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "::notice title=Modrinth skipped::Add a MODRINTH_TOKEN repository secret to publish releases to Modrinth."
            exit 0
          fi

          publish() {
            local jar=$1 suffix=$2 game_version=$3 changelog=$4 type=$5
            local mod_version
            mod_version=$(basename "$jar" | sed -E "s/^inputbooster-(.*)-mc[0-9]+\.jar$/\1/")
            MODRINTH_VERSION_TYPE="$type" MODRINTH_CHANGELOG="$changelog" \
              scripts/publish_modrinth.sh "$jar" "${mod_version}-mc${suffix}" \
              "InputBooster ${mod_version} (MC ${game_version})" "$game_version"
          }

          # Only the four targets requested for Modrinth are uploaded there;
          # the GitHub release still carries every built jar.
          publish_one() {
            local jar=$1 changelog=$2 game_version=$3 version=$4
            if [ ! -f "$jar" ]; then
              echo "::error title=Modrinth skipped a target::$jar was not built"; exit 1
            fi
            MODRINTH_VERSION_TYPE=alpha MODRINTH_CHANGELOG="$changelog" \
              scripts/publish_modrinth.sh "$jar" "$version" "InputBooster $version (MC $game_version)" "$game_version"
          }

          publish_one modrinth-artifacts/modern/inputbooster-4.1.3-alpha1-mc263.jar \
            RELEASE_NOTES_4.1.3-alpha1.md 26.3 4.1.3-alpha1-mc263
          publish_one modrinth-artifacts/modern/inputbooster-4.1.3-alpha1-mc262.jar \
            RELEASE_NOTES_4.1.3-alpha1.md 26.2 4.1.3-alpha1-mc262
          publish_one modrinth-artifacts/modern/inputbooster-4.1.3-alpha1-mc2612.jar \
            RELEASE_NOTES_4.1.3-alpha1.md 26.1.2 4.1.3-alpha1-mc2612
          publish_one modrinth-artifacts/legacy/inputbooster-3.1.6-alpha-mc12111.jar \
            RELEASE_NOTES_3.1.6-alpha.md 1.21.11 3.1.6-alpha-mc12111
