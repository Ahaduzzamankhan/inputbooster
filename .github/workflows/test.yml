name: Fabric Tests

on:
  push:
    branches:
      - main
      - fabric-26.2-26.3
    paths:
      - "fabric/**"
      - "src/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "fabric/**"
      - "src/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Minecraft ${{ matrix.minecraft }} — JUnit + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.2"
            version_range: ">=26.2 <26.3"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            version_range: ">=26.3 <26.4"
            fabric_api: "0.161.0+26.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit tests and build Fabric mod
        working-directory: fabric
        run: |
          chmod +x gradlew
          ./gradlew clean test build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            "-Pminecraft_version_range=${{ matrix.version_range }}" \
            -Pfabric_version=${{ matrix.fabric_api }}

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-mc${{ matrix.minecraft }}
          path: |
            fabric/build/reports/tests/test/
            fabric/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Fabric mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inputbooster-fabric-mc${{ matrix.minecraft }}
          path: fabric/build/libs/*-fabric-mc${{ matrix.minecraft == '26.2' && '262' || '263' }}.jar
          if-no-files-found: error
          retention-days: 14
