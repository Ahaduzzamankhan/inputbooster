org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1g
org.gradle.java.installations.auto-download=true
org.gradle.parallel=true

# Mod metadata
mod_id=inputbooster
mod_group_id=dev.inputbooster
mod_version=3.1.5
# The git tag the release workflow publishes. The jar names carry the version
# and the Minecraft version, for example inputbooster-3.1.5-mc12111.jar.
release_tag=v3.1.5-beta

# Minecraft / Fabric targets. 1.21.x still ships obfuscated, so Loom remaps the
# game to the official Mojang names the sources are written against.
minecraft_version=1.21.11
minecraft_version_range=>=1.21.11 <1.21.12
loader_version=0.20.1
loom_version=1.18.2
joml_version=1.10.9
gson_version=2.14.0
loader_version_range=>=0.19.0
fabric_version=0.141.6+1.21.11
fabric_version_range=>=0.141.6

# Tests
junit_version=5.11.4
