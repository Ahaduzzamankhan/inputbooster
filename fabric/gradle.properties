org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1g
org.gradle.java.installations.auto-download=true
org.gradle.parallel=true

# Mod metadata
mod_id=inputbooster
mod_group_id=dev.inputbooster
mod_version=4.0.0-alpha-fabric

# Branch fabric-26.3 pins Minecraft 26.3. The sibling branch fabric-26.2 pins
# 26.2; each builds exactly one version.
minecraft_version=26.3
# NOT "[26.3,26.4)": Fabric loader 0.19.5 mis-parses bracket ranges when the
# Minecraft version has two components — "[26.3,26.4)" rejects 26.3 itself
# ("but only the wrong version is present: 26.3!"). The space separated
# comparison form is parsed and evaluated correctly.
minecraft_version_range=>=26.3 <26.4
loader_version=0.19.5
loom_version=1.18.2
# JOML and LWJGL are intentionally absent: both ship with Minecraft. The mod
# only uses org.joml.Matrix3x2f as the pose type GuiRenderState#addText
# requires, and never calls into LWJGL or OpenGL directly, which is what keeps
# the HUD, overlay and GUI identical on the Vulkan renderer.
gson_version=2.14.0
loader_version_range=>=0.19.0
fabric_version=0.161.0+26.3
fabric_version_range=>=0.161.0

# Tests
junit_version=5.11.4