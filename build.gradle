plugins {
    id "fabric-loom" version "1.9.2"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = "FabricMC"; url = "https://maven.fabricmc.net/" }
    maven { name = "QuiltMC"; url = "https://maven.quiltmc.org/repository/release/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"
    filesMatching(["fabric.mod.json", "quilt.mod.json"]) {
        expand "version": project.version,
<<<<<<< Updated upstream
               "minecraft_version": project.minecraft_version,
               "minecraft_version_range": project.minecraft_version_range
=======
               "minecraft_version": project.minecraft_version
>>>>>>> Stashed changes
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = targetJavaVersion
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
    // Include both mod manifests for Fabric + Quilt compatibility
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
